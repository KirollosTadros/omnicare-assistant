name: docker-insurance

services:
  backend:
    image: docker-insurance-backend:latest
    container_name: docker-insurance-backend
    build:
      context: ./backend
      additional_contexts:
        pipcache: ./.pip-cache
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - backend-data:/app/data
      - chroma-data:/app/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: docker-insurance-frontend:latest
    container_name: docker-insurance-frontend
    build:
      context: ./frontend
      additional_contexts:
        pipcache: ./.pip-cache
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  chroma-data:
